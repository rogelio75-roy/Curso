[project]
name = "taskflow-api"
version = "0.1.0"
description = "API de TaskFlow para el curso"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# El directorio local `alembic/` hace que isort clasifique el paquete `alembic`
# como first-party; es una dependencia de terceros.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
